name: Tibo watcher

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 실행 방식
        required: true
        default: test-bot
        type: choice
        options:
          - test-bot
          - watch
          - watch-loop
          - smoke
          - smoke-resets

permissions:
  contents: read

concurrency:
  group: help-me-tibooo-${{ (github.event_name == 'schedule' || inputs.mode == 'watch' || inputs.mode == 'watch-loop') && 'watcher' || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: ${{ (github.event_name != 'schedule' && inputs.mode != 'watch-loop') || (vars.WATCHER_PAUSED != 'true' && github.event.repository.private == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: 실행 방식 결정
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "value=watch-loop" >> "$GITHUB_OUTPUT"
          else
            echo "value=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"
          fi
      - name: 감시 상태 복원
        if: steps.mode.outputs.value == 'watch' || steps.mode.outputs.value == 'watch-loop'
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: help-me-tibooo-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: help-me-tibooo-state-
      - name: 감시 실행
        if: steps.mode.outputs.value == 'watch'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: python -m help_me_tibooo watch --state-path .state/watcher.json
      - name: 반복 감시 실행
        id: loop
        if: steps.mode.outputs.value == 'watch-loop'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: |
          set +e
          python -u -m help_me_tibooo watch-loop --state-path .state/watcher.json --metrics-path .observability/watch.jsonl --interval-seconds 120 --duration-seconds 600
          status=$?
          if [ "$status" -eq 0 ] || [ "$status" -eq 1 ]; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Discord 봇 테스트
        if: steps.mode.outputs.value == 'test-bot'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: python -m help_me_tibooo test-bot
      - name: 공개 소스 smoke
        if: steps.mode.outputs.value == 'smoke'
        run: python -m help_me_tibooo smoke
      - name: 리셋 API smoke
        if: steps.mode.outputs.value == 'smoke-resets'
        run: python -m help_me_tibooo smoke --scope resets
      - name: 감시 상태 저장
        if: ${{ always() && (steps.mode.outputs.value == 'watch' || steps.mode.outputs.value == 'watch-loop') && hashFiles('.state/watcher.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .state
          key: help-me-tibooo-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 다음 반복 감시 요청
        if: ${{ !cancelled() && steps.loop.outputs.completed == 'true' && vars.WATCHER_PAUSED != 'true' }}
        uses: actions/github-script@v7
        env:
          STATE_CACHE_KEY: help-me-tibooo-state-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const continueWatch = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/continue-watch.cjs`);
            await continueWatch({github, context, core, cacheKey: process.env.STATE_CACHE_KEY});
      - name: 수집 진단 저장
        if: ${{ always() && steps.mode.outputs.value == 'watch-loop' }}
        uses: actions/upload-artifact@v4
        with:
          name: watcher-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .observability/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
