name: Tibo watcher

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 실행 방식
        required: true
        default: test-bot
        type: choice
        options:
          - test-bot
          - watch
          - smoke
          - smoke-resets

permissions:
  contents: read

concurrency:
  group: help-me-tibooo-watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: 실행 방식 결정
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "value=watch" >> "$GITHUB_OUTPUT"
          else
            echo "value=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"
          fi
      - name: 감시 상태 복원
        if: steps.mode.outputs.value == 'watch'
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: help-me-tibooo-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: help-me-tibooo-state-
      - name: 감시 실행
        if: steps.mode.outputs.value == 'watch'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: python -m help_me_tibooo watch --state-path .state/watcher.json
      - name: Discord 봇 테스트
        if: steps.mode.outputs.value == 'test-bot'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: python -m help_me_tibooo test-bot
      - name: 공개 소스 smoke
        if: steps.mode.outputs.value == 'smoke'
        run: python -m help_me_tibooo smoke
      - name: 리셋 API smoke
        if: steps.mode.outputs.value == 'smoke-resets'
        run: python -m help_me_tibooo smoke --scope resets
      - name: 감시 상태 저장
        if: ${{ always() && steps.mode.outputs.value == 'watch' && hashFiles('.state/watcher.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .state
          key: help-me-tibooo-state-${{ github.run_id }}-${{ github.run_attempt }}
